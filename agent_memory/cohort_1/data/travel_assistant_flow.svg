<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1170" viewBox="0 0 1120 1170"><rect width="100%" height="100%" fill="#07100e"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#b5fa52"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#e5eee9}.title{font-size:23px;font-weight:bold}.note{font-size:16px;fill:#a8beb2}.tier{font-size:18px;font-weight:bold;fill:#b5fa52}</style><text x="50" y="55" class="title">Memory-aware travel research · one visible loop</text><rect x="65" y="90" width="990" height="90" rx="12" fill="#10201a" stroke="#31503f"/><text x="90" y="123" class="title">1. Traveler request</text><text x="90" y="154" class="note">User supplies trip details and explicit preferences</text><path d="M560,180 V200" stroke="#b5fa52" stroke-width="3" marker-end="url(#arrow)"/><rect x="65" y="205" width="990" height="90" rx="12" fill="#10201a" stroke="#31503f"/><text x="90" y="238" class="title">2. Load current memory</text><text x="90" y="269" class="note">Session · entity profile · conversation · workflow outcomes</text><path d="M560,295 V315" stroke="#b5fa52" stroke-width="3" marker-end="url(#arrow)"/><rect x="65" y="320" width="990" height="90" rx="12" fill="#10201a" stroke="#31503f"/><text x="90" y="353" class="title">3. Construct the context</text><text x="90" y="384" class="note">Stable cached prefix → changing memory suffix</text><path d="M560,410 V430" stroke="#b5fa52" stroke-width="3" marker-end="url(#arrow)"/><rect x="65" y="435" width="990" height="90" rx="12" fill="#10201a" stroke="#31503f"/><text x="90" y="468" class="title">4. Count tokens and compact</text><text x="90" y="499" class="note">Host threshold + agent-requested compaction</text><path d="M560,525 V545" stroke="#b5fa52" stroke-width="3" marker-end="url(#arrow)"/><rect x="65" y="550" width="990" height="90" rx="12" fill="#10201a" stroke="#31503f"/><text x="90" y="583" class="title">5. Model chooses an action</text><text x="90" y="614" class="note">Raw Anthropic · cache read/write usage is visible</text><path d="M560,640 V660" stroke="#b5fa52" stroke-width="3" marker-end="url(#arrow)"/><rect x="65" y="665" width="990" height="90" rx="12" fill="#10201a" stroke="#31503f"/><text x="90" y="698" class="title">6. Retrieve or search</text><text x="90" y="729" class="note">Oracle HNSW → reranker · Tavily live web search</text><path d="M560,755 V775" stroke="#b5fa52" stroke-width="3" marker-end="url(#arrow)"/><rect x="65" y="780" width="990" height="90" rx="12" fill="#10201a" stroke="#31503f"/><text x="90" y="813" class="title">7. Offload and record</text><text x="90" y="844" class="note">Full tool payload → compressed Oracle object · success/failure event</text><path d="M560,870 V890" stroke="#b5fa52" stroke-width="3" marker-end="url(#arrow)"/><rect x="65" y="895" width="990" height="90" rx="12" fill="#10201a" stroke="#31503f"/><text x="90" y="928" class="title">8. Read details just in time</text><text x="90" y="959" class="note">ID + description → unpack summary or original result</text><path d="M560,985 V1005" stroke="#b5fa52" stroke-width="3" marker-end="url(#arrow)"/><rect x="65" y="1010" width="990" height="90" rx="12" fill="#10201a" stroke="#31503f"/><text x="90" y="1043" class="title">9. Grounded research shortlist</text><text x="90" y="1074" class="note">Actual source links · no invented fares or reservations</text></svg>